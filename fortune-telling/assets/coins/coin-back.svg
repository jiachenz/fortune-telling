<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 古铜色渐变 - 反面 -->
    <radialGradient id="coinGradientBack" cx="65%" cy="65%" r="65%" fx="65%" fy="65%">
      <stop offset="0%" style="stop-color:#C9B896"/>
      <stop offset="30%" style="stop-color:#A89070"/>
      <stop offset="60%" style="stop-color:#8B7355"/>
      <stop offset="100%" style="stop-color:#6B5344"/>
    </radialGradient>
    
    <!-- 花瓣渐变 -->
    <radialGradient id="petalGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#6B5344"/>
      <stop offset="100%" style="stop-color:#4A3728"/>
    </radialGradient>
  </defs>
  
  <!-- 外圆 - 钱币主体 -->
  <circle cx="100" cy="100" r="95" fill="url(#coinGradientBack)" 
          stroke="#5C4033" stroke-width="3"/>
  
  <!-- 外圆边缘纹理 -->
  <circle cx="100" cy="100" r="90" fill="none" 
          stroke="#8B7355" stroke-width="1" opacity="0.5"/>
  <circle cx="100" cy="100" r="85" fill="none" 
          stroke="#6B5344" stroke-width="2"/>
  
  <!-- ===== 大梅花（占据约2/3面积）===== -->
  <g transform="translate(100, 100)" fill="url(#petalGradient)" opacity="0.9">
    
    <!-- 五片花瓣 - 均匀分布在圆周上 -->
    <!-- 花瓣1 - 上 -->
    <ellipse cx="0" cy="-42" rx="22" ry="32" 
             stroke="#3D2914" stroke-width="1.5"/>
    
    <!-- 花瓣2 - 右上 -->
    <ellipse cx="40" cy="-13" rx="22" ry="32" 
             transform="rotate(72 40 -13)"
             stroke="#3D2914" stroke-width="1.5"/>
    
    <!-- 花瓣3 - 右下 -->
    <ellipse cx="25" cy="34" rx="22" ry="32" 
             transform="rotate(144 25 34)"
             stroke="#3D2914" stroke-width="1.5"/>
    
    <!-- 花瓣4 - 左下 -->
    <ellipse cx="-25" cy="34" rx="22" ry="32" 
             transform="rotate(-144 -25 34)"
             stroke="#3D2914" stroke-width="1.5"/>
    
    <!-- 花瓣5 - 左上 -->
    <ellipse cx="-40" cy="-13" rx="22" ry="32" 
             transform="rotate(-72 -40 -13)"
             stroke="#3D2914" stroke-width="1.5"/>
    
    <!-- 花瓣内部纹理线条 -->
    <g stroke="#5C4033" stroke-width="1" fill="none" opacity="0.6">
      <!-- 上花瓣纹理 -->
      <path d="M0,-20 Q0,-35 0,-50"/>
      <path d="M-6,-22 Q-4,-38 -2,-48"/>
      <path d="M6,-22 Q4,-38 2,-48"/>
      
      <!-- 右上花瓣纹理 -->
      <path d="M20,-6 Q32,-10 42,-18" transform="rotate(72 20 -6)"/>
      
      <!-- 右下花瓣纹理 -->
      <path d="M12,17 Q20,28 26,40" transform="rotate(144 12 17)"/>
      
      <!-- 左下花瓣纹理 -->
      <path d="M-12,17 Q-20,28 -26,40" transform="rotate(-144 -12 17)"/>
      
      <!-- 左上花瓣纹理 -->
      <path d="M-20,-6 Q-32,-10 -42,-18" transform="rotate(-72 -20 -6)"/>
    </g>
    
    <!-- 花蕊 - 中心圆环 -->
    <circle cx="0" cy="0" r="16" fill="#8B7355" stroke="#5C4033" stroke-width="2"/>
    <circle cx="0" cy="0" r="10" fill="#A89070" stroke="#6B5344" stroke-width="1"/>
    
    <!-- 花蕊点 - 五个小点围绕中心 -->
    <circle cx="0" cy="-8" r="2.5" fill="#5C4033"/>
    <circle cx="7.6" cy="-2.5" r="2.5" fill="#5C4033"/>
    <circle cx="4.7" cy="6.5" r="2.5" fill="#5C4033"/>
    <circle cx="-4.7" cy="6.5" r="2.5" fill="#5C4033"/>
    <circle cx="-7.6" cy="-2.5" r="2.5" fill="#5C4033"/>
    
    <!-- 中心点 -->
    <circle cx="0" cy="0" r="3" fill="#6B5344"/>
  </g>
  
  <!-- 中间方孔（覆盖在花蕊上方） -->
  <rect x="82" y="82" width="36" height="36" rx="2" ry="2"
        fill="#1A1A1A" stroke="#3D2914" stroke-width="2"/>
  
  <!-- 方孔内边缘 -->
  <rect x="84" y="84" width="32" height="32" rx="1" ry="1"
        fill="none" stroke="#5C4033" stroke-width="1" opacity="0.5"/>
  
  <!-- 做旧斑点效果 -->
  <circle cx="65" cy="55" r="5" fill="#5C4033" opacity="0.08"/>
  <circle cx="145" cy="135" r="7" fill="#4A3728" opacity="0.06"/>
  <circle cx="50" cy="145" r="4" fill="#5C4033" opacity="0.08"/>
  <circle cx="155" cy="65" r="6" fill="#4A3728" opacity="0.05"/>
  
  <!-- 边缘磨损效果 -->
  <circle cx="100" cy="100" r="95" fill="none" 
          stroke="#3D2914" stroke-width="1" opacity="0.25"
          stroke-dasharray="3,5"/>
  
  <!-- 高光效果 -->
  <ellipse cx="70" cy="70" rx="30" ry="22" 
           fill="white" opacity="0.06" transform="rotate(-35 70 70)"/>
</svg>
