<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 古铜色渐变 - 正面（金黄色调，代表阳） -->
    <radialGradient id="coinGradientFront" cx="35%" cy="35%" r="65%" fx="35%" fy="35%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="30%" style="stop-color:#DAA520"/>
      <stop offset="60%" style="stop-color:#B8860B"/>
      <stop offset="100%" style="stop-color:#8B6914"/>
    </radialGradient>
    
    <!-- 内边缘阴影 -->
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="2" dy="2" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>
    
    <!-- 外发光 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 外圆 - 钱币主体 -->
  <circle cx="100" cy="100" r="95" fill="url(#coinGradientFront)" 
          stroke="#8B6914" stroke-width="3"/>
  
  <!-- 外圆边缘纹理 -->
  <circle cx="100" cy="100" r="90" fill="none" 
          stroke="#DAA520" stroke-width="1" opacity="0.5"/>
  <circle cx="100" cy="100" r="85" fill="none" 
          stroke="#B8860B" stroke-width="2"/>
  
  <!-- 中间方孔 -->
  <rect x="82" y="82" width="36" height="36" rx="2" ry="2"
        fill="#2C1810" stroke="#5C4033" stroke-width="2"/>
  
  <!-- 方孔内边缘 -->
  <rect x="84" y="84" width="32" height="32" rx="1" ry="1"
        fill="none" stroke="#8B6914" stroke-width="1" opacity="0.5"/>
  
  <!-- 钱文 - 乾隆通宝风格 -->
  <!-- 上：乾 -->
  <text x="100" y="65" text-anchor="middle" 
        font-family="KaiTi, SimKai, serif" font-size="28" font-weight="bold"
        fill="#3D2914" filter="url(#glow)">乾</text>
  
  <!-- 下：宝 -->
  <text x="100" y="160" text-anchor="middle" 
        font-family="KaiTi, SimKai, serif" font-size="28" font-weight="bold"
        fill="#3D2914" filter="url(#glow)">宝</text>
  
  <!-- 左：通 -->
  <text x="55" y="112" text-anchor="middle" 
        font-family="KaiTi, SimKai, serif" font-size="28" font-weight="bold"
        fill="#3D2914" filter="url(#glow)">通</text>
  
  <!-- 右：隆 -->
  <text x="145" y="112" text-anchor="middle" 
        font-family="KaiTi, SimKai, serif" font-size="28" font-weight="bold"
        fill="#3D2914" filter="url(#glow)">隆</text>
  
  <!-- 高光效果 -->
  <ellipse cx="75" cy="75" rx="35" ry="25" 
           fill="white" opacity="0.15" transform="rotate(-30 75 75)"/>
  
  <!-- 边缘阴影 -->
  <circle cx="100" cy="100" r="95" fill="none" 
          stroke="#5C4033" stroke-width="1" opacity="0.3"/>
</svg>
