<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 主体金属径向渐变（模拟45度打光） -->
    <radialGradient id="cfBase" cx="38%" cy="32%" r="70%" fx="38%" fy="32%">
      <stop offset="0%"   stop-color="#FFF0A0"/>
      <stop offset="18%"  stop-color="#F2C94C"/>
      <stop offset="45%"  stop-color="#C8961A"/>
      <stop offset="72%"  stop-color="#9A6E0A"/>
      <stop offset="100%" stop-color="#6B4A04"/>
    </radialGradient>

    <!-- 边缘厚度渐变（模拟铸造边沿凸起） -->
    <radialGradient id="cfRim" cx="50%" cy="50%" r="50%">
      <stop offset="82%"  stop-color="transparent"/>
      <stop offset="90%"  stop-color="#FFD060" stop-opacity="0.45"/>
      <stop offset="96%"  stop-color="#8B5E08" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4A3200" stop-opacity="0.9"/>
    </radialGradient>

    <!-- 顶部高光（椭圆柔性白光） -->
    <radialGradient id="cfHighlight" cx="42%" cy="22%" r="45%" fx="42%" fy="22%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="60%"  stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- 底部反光（环境光反射） -->
    <radialGradient id="cfReflect" cx="58%" cy="85%" r="35%">
      <stop offset="0%"   stop-color="#FFE070" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFE070" stop-opacity="0"/>
    </radialGradient>

    <!-- 方孔内壁渐变 -->
    <linearGradient id="cfHole" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1A0E00"/>
      <stop offset="100%" stop-color="#3D2510"/>
    </linearGradient>

    <!-- 钱文浮雕质感 -->
    <filter id="cfTextEmboss" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="blur"/>
      <feOffset in="blur" dx="1" dy="1" result="shadow"/>
      <feComposite in="SourceGraphic" in2="shadow" operator="over"/>
    </filter>

    <!-- 整体细微边缘柔化 -->
    <filter id="cfEdge" x="-2%" y="-2%" width="104%" height="104%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- 铸造纹理噪点 -->
    <filter id="cfTexture">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="overlay" result="textured"/>
      <feComposite in="textured" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- === 1. 硬币主体 === -->
  <circle cx="100" cy="100" r="95" fill="url(#cfBase)"/>

  <!-- 铸造纹理叠加（低透明度） -->
  <circle cx="100" cy="100" r="95" fill="url(#cfBase)" filter="url(#cfTexture)" opacity="0.18"/>

  <!-- === 2. 外圈凸起边沿 === -->
  <!-- 外沿暗色圆环（底边） -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#3D2200" stroke-width="5" opacity="0.7"/>
  <!-- 外沿亮色细线（受光侧） -->
  <circle cx="100" cy="100" r="93" fill="none" stroke="#FFD878" stroke-width="1.5" opacity="0.6"
          stroke-dasharray="300 50" stroke-dashoffset="30"/>
  <!-- 外圈整体渐变叠加 -->
  <circle cx="100" cy="100" r="95" fill="url(#cfRim)"/>

  <!-- 内凸环（模拟铸造内沿） -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#8B6210" stroke-width="3" opacity="0.5"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#F0C050" stroke-width="0.8" opacity="0.4"/>

  <!-- === 3. 中间方孔 === -->
  <rect x="82" y="82" width="36" height="36" rx="2" fill="url(#cfHole)"/>
  <!-- 方孔内壁亮边（受光侧） -->
  <line x1="82" y1="82" x2="118" y2="82" stroke="#C89030" stroke-width="1.2" opacity="0.6"/>
  <line x1="82" y1="82" x2="82"  y2="118" stroke="#C89030" stroke-width="1.2" opacity="0.6"/>
  <!-- 方孔内壁暗边（背光侧） -->
  <line x1="118" y1="82"  x2="118" y2="118" stroke="#2A1500" stroke-width="1.5" opacity="0.7"/>
  <line x1="82"  y1="118" x2="118" y2="118" stroke="#2A1500" stroke-width="1.5" opacity="0.7"/>

  <!-- === 4. 钱文（乾隆通宝 — 楷书风格）=== -->
  <!-- 文字阴影层（偏移产生浮雕感） -->
  <text x="101" y="67" text-anchor="middle" font-family="KaiTi, STKaiti, serif"
        font-size="26" font-weight="bold" fill="#4A2E00" opacity="0.6">乾</text>
  <text x="101" y="163" text-anchor="middle" font-family="KaiTi, STKaiti, serif"
        font-size="26" font-weight="bold" fill="#4A2E00" opacity="0.6">宝</text>
  <text x="56" y="113" text-anchor="middle" font-family="KaiTi, STKaiti, serif"
        font-size="26" font-weight="bold" fill="#4A2E00" opacity="0.6">通</text>
  <text x="146" y="113" text-anchor="middle" font-family="KaiTi, STKaiti, serif"
        font-size="26" font-weight="bold" fill="#4A2E00" opacity="0.6">隆</text>
  <!-- 文字亮层（主色） -->
  <text x="100" y="66" text-anchor="middle" font-family="KaiTi, STKaiti, serif"
        font-size="26" font-weight="bold" fill="#7A4E10" filter="url(#cfTextEmboss)">乾</text>
  <text x="100" y="162" text-anchor="middle" font-family="KaiTi, STKaiti, serif"
        font-size="26" font-weight="bold" fill="#7A4E10" filter="url(#cfTextEmboss)">宝</text>
  <text x="55" y="112" text-anchor="middle" font-family="KaiTi, STKaiti, serif"
        font-size="26" font-weight="bold" fill="#7A4E10" filter="url(#cfTextEmboss)">通</text>
  <text x="145" y="112" text-anchor="middle" font-family="KaiTi, STKaiti, serif"
        font-size="26" font-weight="bold" fill="#7A4E10" filter="url(#cfTextEmboss)">隆</text>

  <!-- === 5. 光影 === -->
  <!-- 顶部主高光 -->
  <ellipse cx="82" cy="68" rx="42" ry="28" fill="url(#cfHighlight)" transform="rotate(-20 82 68)"/>
  <!-- 底部环境反光 -->
  <ellipse cx="118" cy="138" rx="30" ry="18" fill="url(#cfReflect)" transform="rotate(20 118 138)"/>
  <!-- 侧面薄高光线条 -->
  <path d="M 40,60 Q 55,35 85,25" stroke="white" stroke-width="2" fill="none"
        opacity="0.2" stroke-linecap="round"/>
</svg>
